name: image updates

# Weekly: asks the public registries which pinned images have moved on and rewrites one
# issue in place, so its edit history is the changelog. It reports only - tag bumps stay
# manual, since one-replica volumes with no backup target are no place for a robot to roll
# a major version.

on:
  schedule:
    # Mondays 06:15 UTC. Weekly, because a report that arrives faster than it can be
    # acted on is noise; off the hour, where GitHub's scheduler is least oversubscribed.
    - cron: "15 6 * * 1"
  workflow_dispatch:
    inputs:
      only:
        description: "Only check refs containing this substring"
        required: false
        type: string

# One run at a time, newest wins - a backlog of last week's reports is worthless.
concurrency:
  group: image-updates
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check for newer image tags
        env:
          # No registry credentials, by design: every registry here gives anonymous
          # callers a pull-scoped token, and internal registries are out of scope because
          # they would need a secret. A 429 is reported per image rather than guessed at.
          #
          # Passed through the environment, not interpolated: ${{ inputs.* }} is expanded
          # before bash sees it, so a semicolon in a dispatch input would run as a command.
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          args=(--markdown report.md --json report.json)
          # An `[ ... ] && ...` one-liner would exit 1 here under `set -e` on the
          # common path where ONLY is unset, failing the step.
          if [ -n "${ONLY:-}" ]; then
            args+=(--only "$ONLY")
          fi
          python3 scripts/check-image-updates.py "${args[@]}"

      - name: Publish to the run summary
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upsert the report issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Container image update report
        run: |
          set -euo pipefail

          {
            cat report.md
            echo
            echo "---"
            echo
            echo "Rewritten in place by [\`image-updates\`]($RUN_URL) on $(date -u '+%Y-%m-%d %H:%M UTC')."
            echo "Floating tags cannot be compared by name from a hosted runner; run"
            echo "\`scripts/check-image-updates.py --from-cluster\` on a machine with"
            echo "cluster access to find pods still running a superseded digest."
          } > body.md

          # Exact title match on a listing, not --search: search tokenises the query, and
          # matching loosely here would overwrite a real issue.
          existing=$(gh issue list --repo "$REPO" --state open --limit 200 \
            --json number,title \
            --jq '[.[] | select(.title == env.TITLE) | .number] | first // empty')

          # --body-file throughout: the report is multi-line Markdown full of backticks
          # and pipes, which is a quoting accident as a shell argument.
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" --body-file body.md
            echo "Updated issue #$existing"
          else
            # The label may not exist yet, and gh treats that as fatal; the report
            # matters more than the label does.
            gh issue create --repo "$REPO" --title "$TITLE" --body-file body.md \
              --label image-updates \
              || gh issue create --repo "$REPO" --title "$TITLE" --body-file body.md
          fi

      - name: Keep the raw results with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-report
          path: |
            report.md
            report.json
          if-no-files-found: warn

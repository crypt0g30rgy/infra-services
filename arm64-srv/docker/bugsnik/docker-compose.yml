# Bugsink: self-hosted, Sentry-SDK compatible error tracking, behind traefik.
# One instance per node; this is the arm64 one, from ~/bugsnik/ on that host. The
# amd64 one (../../../amd64-srv/docker/bugsnik/) has no traefik, so it is a separate
# file - this one cannot run there, the external `internal` network is arm64-only.
#
# SQLite on the ./data bind mount, which is bugsink's documented single-server
# default; Postgres is prepared but unused (see the bottom of this file). One
# container runs both gunicorn and the snappea worker under monofy.
networks:
  internal:
    external: true

services:
  bugsink:
    image: bugsink/bugsink:2.5.1
    container_name: bugsink
    restart: unless-stopped
    networks:
      - internal

    # Everything lives in .env; the two below are derived from it so each host name
    # is written down once.
    env_file:
      - .env

    environment:
      # Builds DSNs and the links in alert emails. No trailing slash.
      BASE_URL: "https://${BUGSINK_INTERNAL_HOST}"
      # Django answers 400 to any Host not listed: both routers below, plus loopback
      # for the healthcheck.
      ALLOWED_HOSTS: "${BUGSINK_INTERNAL_HOST},${BUGSINK_EXTERNAL_HOST},127.0.0.1,localhost"

    ports:
      # Direct LAN access, bypassing traefik - also the way in while DNS or the
      # certificate is still broken.
      - "${BUGSINK_HOST_PORT}:${PORT}"

    volumes:
      # db.sqlite3 lives here. Must exist and be owned by the image's uid 14237
      # BEFORE the first `up`, or docker creates it root-owned and migrations fail
      # read-only:  mkdir -p data && sudo chown -R 14237:14237 data
      - ./data:/data

    security_opt:
      - no-new-privileges:true

    healthcheck:
      # Same probe the image ships, repeated so it follows ${PORT} instead of a
      # hard-coded 8000. /health/ready needs no auth.
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://127.0.0.1:${PORT}/health/ready\").raise_for_status()'"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First boot runs `check --deploy` and every migration before it listens.
      start_period: 60s

    labels:
      - "traefik.enable=true"

      # --------------------------
      # Internal Router
      # --------------------------
      - "traefik.http.routers.bugsink-internal.rule=Host(`${BUGSINK_INTERNAL_HOST}`)"
      - "traefik.http.routers.bugsink-internal.entrypoints=websecure"
      - "traefik.http.routers.bugsink-internal.tls=true"
      - "traefik.http.routers.bugsink-internal.tls.certresolver=myresolver"

      # --------------------------
      # External Router
      # --------------------------
      - "traefik.http.routers.bugsink-external.rule=Host(`${BUGSINK_EXTERNAL_HOST}`)"
      - "traefik.http.routers.bugsink-external.entrypoints=websecure"
      # - "traefik.http.routers.bugsink-external.tls.certresolver=myresolver" # disabled since cf tunnel currently handles that

      # --------------------------
      # No auth middleware, on purpose
      # --------------------------
      # SDKs POST to /api/<project>/envelope/ with only the DSN key, so basicauth
      # here silently drops every event. The UI has its own login.

      # --------------------------
      # Shared Service
      # --------------------------
      - "traefik.http.services.bugsink-internal.loadbalancer.server.port=${PORT}"

    deploy:
      resources:
        limits:
          # Idles ~200M; ingestion is the spike, since MAX_ENVELOPE_SIZE defaults to
          # 100 MiB decompressed in memory.
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

# --------------------------
# Postgres, for later
# --------------------------
# To switch: uncomment this service, uncomment DATABASE_URL in .env. It starts
# EMPTY - db.sqlite3 is not imported (https://www.bugsink.com/docs/postgresql/).
#

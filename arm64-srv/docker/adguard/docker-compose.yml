# AdGuard Home: the LAN's DNS and the cluster's upstream resolver — CoreDNS forwards
# to /etc/resolv.conf and both nodes point at 192.168.0.59, so every non-cluster
# lookup lands here. Breaking this file breaks the cluster.
#
# Runs on the pi from /home/w3b/adguard, which is not a checkout of this repo; this
# is a transcription, keep the two equal. See README.md.
services:
  adguardhome:
    image: adguard/adguardhome:v0.107.79
    container_name: adguardhome
    restart: unless-stopped
    networks:
      # Plain bridge (172.19.0.0/16) shared with traefik and monitoring;
      # `./manage.sh up` creates it if missing.
      internal:
      # Leave commented. This was once live asking for 192.168.1.98 — the wrong /24
      # for this LAN, unreachable, publishing no ports, which takes cluster DNS out.
      # macvlan_net:
      #   ipv4_address: 192.168.1.98
    ports:
      # 0.0.0.0, which is what makes 192.168.0.59:53 answer. Published UDP on a
      # bridge goes through userspace docker-proxy rather than kernel NAT, so every
      # cluster DNS packet is copied — a hop host networking would remove.
      - "3000:3000"
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      # All the state, so the container is disposable: ./config holds the ~4 KB
      # config, ./work the query log, stats and filters (~420 MB, gitignored).
      - ./work:/opt/adguardhome/work
      - ./config:/opt/adguardhome/conf
    environment:
      - TZ=Europe/Moscow
    labels:
      - "traefik.enable=true"

      # --------------------------
      # Internal Router
      # --------------------------
      # ADGUARD_INTERNAL_HOST comes from ./.env, which is gitignored; README.md has
      # the one line it needs.
      - "traefik.http.routers.adguard.rule=Host(`${ADGUARD_INTERNAL_HOST}`)"
      - "traefik.http.routers.adguard.entrypoints=websecure"
      - "traefik.http.routers.adguard.tls=true"
      - "traefik.http.routers.adguard.tls.certresolver=myresolver"

      # --------------------------
      # Shared Service
      # --------------------------
      - "traefik.http.services.adguard.loadbalancer.server.port=3000"

    # Compose v2 honours these outside swarm (verified on the running container).
    # A quarter core is tight for a DoH-only resolver — every cache miss is a TLS
    # handshake, so raise this before blaming the network for latency.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.12"
          memory: 128M

networks:
  internal:
    external: true
  # See the macvlan note above before uncommenting anything here.
  # macvlan_net:
  #   external: true

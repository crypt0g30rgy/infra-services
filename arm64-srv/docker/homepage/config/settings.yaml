---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/settings/
#
# Merged 2026-09-05 from settings.yml, which held the customisation below while
# this file held only the provider stubs. Homepage reads whichever it finds and
# two files for one config is one file too many; .yaml is the extension the
# upstream docs use, so it is the one kept here.

title: "My Homelab"
description: "Welcome to my homelab! Here you'll find links to all my self-hosted services and projects."
theme: "dark"
favicon: "https://raw.githubusercontent.com/gethomepage/homepage/main/public/favicon.ico"
logo: "https://raw.githubusercontent.com/gethomepage/homepage/main/public/logo.png"
background: "https://raw.githubusercontent.com/gethomepage/homepage/main/public/background.jpg"

providers:
  openweathermap: openweathermapapikey
  weatherapi: weatherapiapikey

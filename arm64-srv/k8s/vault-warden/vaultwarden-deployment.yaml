apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      # On dell with postgres-statefulset.yaml: dell is the only Longhorn storage node, so a
      # pod there writes its own disk instead of reaching the same data over iSCSI, and the
      # pi had ~3670m of 4000m CPU requested against dell's ~15%. Both images are multi-arch.
      nodeSelector:
        kubernetes.io/hostname: dell-amd64-srv

      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.2
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: vaultwarden-config
            - secretRef:
                name: vaultwarden-secret
          env:
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.vaultwarden.svc.cluster.local:5432/$(POSTGRES_DB)"
            - name: ICON_SERVICE
              value: duckduckgo
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data

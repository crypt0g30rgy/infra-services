# apiVersion: v1
# kind: Secret
# metadata:
#   name: s3-backup-env
#   namespace: vaultwarden
# type: Opaque
# stringData:
#   AWS_ACCESS_KEY_ID: "AKIA34BAGDIHYYBHR3SP"
#   AWS_SECRET_ACCESS_KEY: "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"
#   AWS_REGION: "eu-west-1"
#   S3_BUCKET: "secrets-and-backups"
#   RETENTION_DAYS: "14"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-backup-script
  namespace: vaultwarden
data:
  backup.sh: |
        #!/usr/bin/env bash
        set -euo pipefail

        TIMESTAMP=$(date -u +"%Y%m%dT%H%M%SZ")

        WORKDIR="/tmp/backup"
        mkdir -p "${WORKDIR}"

        DB_BACKUP="vaultwarden-db-${TIMESTAMP}.sql.gz"
        DATA_BACKUP="vaultwarden-data-${TIMESTAMP}.tar.gz"


        echo "[1/8] PostgreSQL backup"

        DATABASE_URL="postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres.vaultwarden.svc.cluster.local:5432/${POSTGRES_DB}"

        export PGPASSWORD="${POSTGRES_PASSWORD}"

        pg_dump \
          --dbname="${DATABASE_URL}" \
          -F c \
          | gzip > "${WORKDIR}/${DB_BACKUP}"


        echo "[2/8] Vaultwarden data backup"

        tar \
          -czf "${WORKDIR}/${DATA_BACKUP}" \
          -C /data .


        echo "[3/8] Creating checksums"

        sha256sum \
          "${WORKDIR}/${DB_BACKUP}" \
          > "${WORKDIR}/${DB_BACKUP}.sha256"


        sha256sum \
          "${WORKDIR}/${DATA_BACKUP}" \
          > "${WORKDIR}/${DATA_BACKUP}.sha256"



        echo "[4/8] Uploading database backup"

        aws s3 cp \
          "${WORKDIR}/${DB_BACKUP}" \
          "s3://${S3_BUCKET}/${S3_PATH}/${DB_BACKUP}"

        aws s3 cp \
          "${WORKDIR}/${DB_BACKUP}.sha256" \
          "s3://${S3_BUCKET}/${S3_PATH}/${DB_BACKUP}.sha256"



        echo "[5/8] Uploading data backup"

        aws s3 cp \
          "${WORKDIR}/${DATA_BACKUP}" \
          "s3://${S3_BUCKET}/${S3_PATH}/${DATA_BACKUP}"

        aws s3 cp \
          "${WORKDIR}/${DATA_BACKUP}.sha256" \
          "s3://${S3_BUCKET}/${S3_PATH}/${DATA_BACKUP}.sha256"



        echo "[6/8] Retention cleanup"


        for PREFIX in vaultwarden-db vaultwarden-data; do

          mapfile -t FILES < <(
            aws s3api list-objects-v2 \
              --bucket "${S3_BUCKET}" \
              --prefix "${S3_PATH}/${PREFIX}-" \
              --query 'Contents[].Key' \
              --output text \
              | grep -E "\.(gz)$" \
              | sort -r
          )


          COUNT=0

          for FILE in "${FILES[@]}"; do

            COUNT=$((COUNT+1))


            # Always keep newest two
            if [ "${COUNT}" -le 2 ]; then
              continue
            fi


            FILE_DATE=$(echo "${FILE}" \
              | sed -E 's/.*-[0-9]{8}T[0-9]{6}Z.*/\0/')


            OBJECT_DATE=$(aws s3api head-object \
              --bucket "${S3_BUCKET}" \
              --key "${FILE}" \
              --query LastModified \
              --output text)


            OBJECT_TS=$(date -d "${OBJECT_DATE}" +%s)

            LIMIT=$(date -d "-${RETENTION_DAYS} days" +%s)


            if [ "${OBJECT_TS}" -lt "${LIMIT}" ]; then

              echo "Deleting ${FILE}"

              aws s3 rm \
                "s3://${S3_BUCKET}/${FILE}"

              aws s3 rm \
                "s3://${S3_BUCKET}/${FILE}.sha256" \
                || true

            fi

          done

        done



        echo "[7/8] Cleanup"

        rm -rf "${WORKDIR}"


        echo "[8/8] Backup completed successfully"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-backup
  namespace: vaultwarden
spec:
  schedule: "0 0 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: backup
            # The shared backup image, pinned by multi-arch *index* digest: this
            # cluster is arm64 + amd64 and a per-platform digest would be
            # unpullable on one node (verified by resolving the tag on both and
            # comparing imageIDs). Refresh with
            # `crane digest registry.internal.xboy.me/tools/s3-backup:2.0.0`.
            #
            # It replaces vaultwarden-backup:1.0.0 - what was actually running -
            # and the ghcr.io/your-org placeholder this file used to carry, which
            # matched nothing. Everything the script needs is baked in: bash,
            # aws-cli, pg_dump 18.6, tar, gzip, sha256sum, GNU date, grep and sed.
            image: registry.internal.xboy.me/tools/s3-backup:2.0.0@sha256:9dd96606c8b5c53a442d62b1a869469fde9692bc6b7ce08804237387640f0a4e
            imagePullPolicy: IfNotPresent
            command:
              - /scripts/backup.sh
            # The image runs as uid 100 (`scripts`) and needs nothing more: it
            # installs nothing, and the only paths written during a run are under
            # /tmp, which is the emptyDir below. /data is mounted read-only and is
            # world-readable, so uid 100 can tar it without owning it.
            securityContext:
              runAsNonRoot: true
              runAsUser: 100
              runAsGroup: 101
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
              seccompProfile:
                type: RuntimeDefault
            env:
            # The AWS CLI keeps its config under $HOME, so HOME has to point at
            # the writable emptyDir - with readOnlyRootFilesystem the image's own
            # home directory is not writable.
            - name: HOME
              value: /tmp
            # aws s3 configuration
            - name: AWS_REGION
              value: "eu-west-1"
            - name: S3_BUCKET
              valueFrom:
                secretKeyRef:
                  name: s3-backup-env
                  key: S3_BUCKET
            - name: S3_PATH
              value: "vault-auto-backups"
            - name: RETENTION_DAYS
              value: "14"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-backup-env
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-backup-env
                  key: AWS_SECRET_ACCESS_KEY
              # postgress configuration
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secret
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.vaultwarden.svc.cluster.local:5432/$(POSTGRES_DB)"

            volumeMounts:
            - name: vaultwarden-data
              mountPath: /data
              readOnly: true
            - name: backup-script
              mountPath: /scripts
              readOnly: true
            - name: work
              mountPath: /tmp

          volumes:
          - name: vaultwarden-data
            persistentVolumeClaim:
              claimName: vaultwarden-data
          - name: backup-script
            configMap:
              name: vaultwarden-backup-script
              defaultMode: 0755
          # HOME, the AWS CLI's config, both archives and their checksums all live
          # here. A sizeLimit so a runaway backup gets the pod evicted instead of
          # filling the pi's node disk - the same disk the control plane and every
          # Longhorn attachment are on.
          - name: work
            emptyDir:
              sizeLimit: 4Gi
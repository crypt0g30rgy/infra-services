apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: vaultwarden
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Co-located with the vaultwarden deployment on dell, where its Longhorn
      # replica physically is. See the note in vaultwarden-deployment.yaml.
      #
      # This moved the data directory from arm64 to x86_64. PostgreSQL does not
      # officially support that - the on-disk format is platform-dependent - but
      # both are 64-bit little-endian and the image is the same musl build, so
      # the collations match. It started clean ("Skipping initialization",
      # recovered from a clean shutdown) and all 29 table row counts matched the
      # pre-migration pg_dumpall. Indexes were rebuilt with REINDEX DATABASE
      # afterwards anyway, which is the one thing a collation difference would
      # have corrupted. If this node ever moves arch again, dump and restore.
      #
      # That caveat is now moot for the current data: the 15 -> 18 upgrade below
      # was a dump and restore, so the on-disk cluster was written from scratch
      # by an x86_64 PostgreSQL 18 running on this node.
      nodeSelector:
        kubernetes.io/hostname: dell-amd64-srv

      containers:
        - name: postgres
          # PostgreSQL 18. This was not a tag bump: 18 refuses to start on a
          # data directory written by 15, so the database was dumped with
          # pg_dumpall, the volume was emptied and the dump restored. Bumping
          # the major here again without doing that leaves the pod in
          # CrashLoopBackOff on "database files are incompatible with server".
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            # Explicit, and a *subdirectory* of the mount, for two reasons.
            #
            # postgres:18 changed the image's own default PGDATA to
            # /var/lib/postgresql/18/docker and declares /var/lib/postgresql as
            # the volume. Leave it unset and the cluster is initialised in the
            # container's writable layer, outside the PVC mounted below, and is
            # gone on the next pod restart - silently, because it starts fine.
            #
            # It also cannot be the mount root: this is a Longhorn ext4 volume,
            # so /var/lib/postgresql/data contains lost+found and initdb refuses
            # a non-empty directory. Up to 15 the data sat at the root because
            # the volume used to be microk8s-hostpath, which has no lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                  secretKeyRef:
                    name: vaultwarden-secret
                    key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Named explicitly instead of inheriting the cluster default. This used
        # to be unset, which silently meant microk8s-hostpath - a directory on
        # the pi, which is why this database could never move off that node.
        #
        # volumeClaimTemplates is immutable, so changing this on a live
        # StatefulSet is not an edit: the StatefulSet has to be deleted and
        # recreated. Do it with --cascade=orphan if the pod is running and you
        # want it to keep running; the existing postgres-data-postgres-0 PVC is
        # then adopted by name, not replaced. See ../longhorn/README.md.
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: vaultwarden
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # The pi with vaultwarden (2026-09-06, was dell). Moving a data directory between
      # architectures is unsupported, so that move was a dump and a restore into a fresh
      # volume: ../../../maintenance/2026-09-06-vaultwarden-to-pi.md.
      nodeSelector:
        kubernetes.io/hostname: pi-5-16gb-srv-0

      containers:
        - name: postgres
          # A major bump is never just a tag edit - PostgreSQL will not start on an
          # older major's data directory. Dump, wipe, restore:
          # ../../../maintenance/2026-09-05-postgres-15-to-18.md
          image: postgres:18-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            # Keep explicit: postgres:18's own default moved to
            # /var/lib/postgresql/18/docker, so unset means a cluster in the
            # container's writable layer that starts fine and vanishes on restart.
            # Must be a subdirectory - initdb refuses the ext4 mount root's
            # lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                  secretKeyRef:
                    name: vaultwarden-secret
                    key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Explicit, because the unset default was microk8s-hostpath and pinned this
        # database to the pi. volumeClaimTemplates is immutable: changing it means
        # deleting the StatefulSet (--cascade=orphan keeps the pod and re-adopts the
        # existing PVC by name). See ../longhorn/README.md.
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi

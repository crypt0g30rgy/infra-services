# XFS, not the default ext4 longhorn class, and that is the whole reason this
# StorageClass exists. It is used by exactly one volume: the BuildKit cache
# below. See the inode note on the PVC for what ext4 did.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-buildcache
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  # Same as the stock `longhorn` class except for fsType. One replica because
  # this is a cache: losing it costs one slow build, and paying to replicate it
  # would be paying to protect data that is rebuilt from scratch on demand.
  dataEngine: v1
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  dataLocality: disabled
  disableRevisionCounter: "true"
  unmapMarkSnapChainRemoved: ignored
  fsType: xfs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkit-cache-pvc
  namespace: jenkins
spec:
  accessModes:
    - ReadWriteOnce
  # Longhorn rather than hostpath so the cache follows the build pod instead of pinning
  # builds to the pi. ReadWriteOnce means one *node* at a time - give the arches separate
  # PVCs if two nodes ever need it at once.
  #
  # XFS, via the class above, because ext4 exhausted its INODES on 2026-08-23 with 16.7G
  # free (2.6M inodes fixed at format time, one per 16KiB, vs ~9KiB per node_modules file).
  # It surfaces as `no space left on device` and expanding only defers it; XFS allocates
  # inodes on demand. Both changes need a reformat, so this PVC was deleted and recreated -
  # a build cache is disposable and warm again after one 5-8 minute refetch.
  storageClassName: longhorn-buildcache
  resources:
    requests:
      # 40Gi, raised from 10Gi on 2026-08-23. This is buildkitd's whole state dir and
      # `snapshots/` is nearly all of it: one multi-arch node build writes four
      # dependency trees plus pnpm's store, which is what keeps builds warm. Its GC
      # works (usage falls back to ~6Gi), so this is peak headroom, not growth.
      #
      # Expanding is live-safe and keeps the cache - patch the claim and Longhorn
      # attaches, resizes and detaches. Do it while no build is running.
      storage: 40Gi


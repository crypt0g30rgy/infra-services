apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins

      # The amd64 box, not the pi: jenkins-home used to be a hostpath directory there, but
      # on Longhorn it is reachable from either node, and the pi had ~3670m of 4000m CPU
      # requested against Jenkins' own 500m. Pinned rather than left to the scheduler,
      # because "wherever it lands" is not a deployment target; the image is multi-arch.
      nodeSelector:
        kubernetes.io/hostname: dell-amd64-srv

      containers:
      - name: jenkins
        image: jenkins/jenkins:2.580

        ports:
        - containerPort: 8080
        # - containerPort: 50000

        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"

        volumeMounts:
        - name: jenkins-home
          mountPath: /var/jenkins_home

      volumes:
      - name: jenkins-home
        persistentVolumeClaim:
          claimName: jenkins-home

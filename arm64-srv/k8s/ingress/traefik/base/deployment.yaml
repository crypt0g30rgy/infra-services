apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: ingress
  labels:
    app: traefik
    app.kubernetes.io/name: traefik
spec:
  replicas: 1
  # maxSurge 0 because the single replica holds an RWO volume: a surged pod scheduled on
  # the other node waits on Multi-Attach forever while the old pod keeps serving, i.e. a
  # rollout that silently never finishes. Stopping first costs seconds of ingress downtime
  # per config change.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app: traefik
        app.kubernetes.io/name: traefik
    spec:
      serviceAccountName: traefik
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 65532
      initContainers:
        # No /data/logs any more - accessLog goes to stdout. /data/acme is kept empty at
        # mode 700 so a restored ACME resolver has somewhere to write without fixing
        # ownership by hand on a live volume.
        - name: init-dirs
          image: alpine:3.24
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /data/acme
              chown -R 65532:65532 /data
              chmod 700 /data/acme
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: traefik
          image: traefik:v3.7.13
          args:
            - --configfile=/etc/traefik/traefik.yaml
          # No env on purpose. CF_DNS_API_TOKEN used to be read from a `cloudflare-api-token`
          # secret for the ACME resolver that traefik.yaml no longer has. The secret was
          # deleted, traefik kept serving for a day (secretKeyRef resolves once, at start),
          # and the next restart took ingress down with CreateContainerConfigError - for a
          # credential with no callers.
          ports:
            - name: web
              containerPort: 80
            - name: websecure
              containerPort: 443
            - name: metrics
              containerPort: 8082
            - name: dashboard
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/traefik
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

        # No logrotate sidecar: accessLog goes to stdout, so rotation is the kubelet's job
        # and retention is Loki's. The old rotator watched a file that is never written
        # again, so it reported healthy while leaving 287 MB of access.log.* on the volume
        # (since deleted). Bring it back only if accessLog goes back to a filePath.

      volumes:
        - name: config
          configMap:
            name: traefik-config
        - name: data
          persistentVolumeClaim:
            claimName: traefik-data

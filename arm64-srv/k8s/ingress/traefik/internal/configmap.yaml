apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  namespace: ingress
data:
  traefik.yaml: |
    log:
      level: INFO
      format: json

    # To stdout, so promtail ships it to Loki: the traefik dashboard's top-paths and
    # top-client-IP panels are Loki queries against these lines. No `filters` (they kept
    # only slow, failed or retried requests, so any per-path count was of those) and no
    # `bufferingSize`. ~17 MB/day raw. `format: json` is required - queries start `| json`.
    accessLog:
      format: json
      fields:
        defaultMode: keep
        names:
          ClientUsername: drop
        headers:
          defaultMode: drop
          names:
            User-Agent: keep
            X-Forwarded-For: keep
            X-Request-Id: keep
            Authorization: drop
            Cookie: drop

    metrics:
      prometheus:
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        buckets:
          - 0.1
          - 0.3
          - 1.2
          - 5.0
        entryPoint: metrics

    # The collector, not jaeger directly: it derives spanmetrics and it batches and retries.
    # The previous endpoint was jaeger.observability, a namespace that has never existed, so
    # every traefik span was dropped and traces began at api-gw with the ingress hop missing.
    tracing:
      otlp:
        grpc:
          endpoint: otel-collector.monitoring.svc.cluster.local:4317
          insecure: true

    ping:
      entryPoint: traefik
      terminatingStatusCode: 204

    entryPoints:
      # trustedIPs decides, per peer, whether traefik appends to X-Forwarded-For or replaces
      # it with the socket address - which is what downstream rate limits and audit fields
      # key on. 10.1.0.0/16 covers the only live path (Cloudflare -> cloudflared pod ->
      # traefik); the Cloudflare edge ranges cover a directly proxied origin and are inert
      # until one exists. api-gw holds the matching half via TRUSTED_PROXY_IPS.
      #
      # NEVER add 0.0.0.0/0 or any range the platform does not control - that lets a caller
      # state their own address, the bypass this list prevents. Ranges from
      # api.cloudflare.com/client/v4/ips, 2026-08-25; static config is read once at boot, so
      # re-check them when touching this file. api-gw's copy refreshes itself, this one does not.
      web:
        address: :80
        forwardedHeaders:
          # Anchored and aliased by websecure below: the two entrypoints must agree, and
          # keeping one copy is what stops them drifting apart.
          trustedIPs: &trustedIPs
            - 10.1.0.0/16
            # Cloudflare IPv4
            - 173.245.48.0/20
            - 103.21.244.0/22
            - 103.22.200.0/22
            - 103.31.4.0/22
            - 141.101.64.0/18
            - 108.162.192.0/18
            - 190.93.240.0/20
            - 188.114.96.0/20
            - 197.234.240.0/22
            - 198.41.128.0/17
            - 162.158.0.0/15
            - 104.16.0.0/13
            - 104.24.0.0/14
            - 172.64.0.0/13
            - 131.0.72.0/22
            # Cloudflare IPv6
            - 2400:cb00::/32
            - 2606:4700::/32
            - 2803:f800::/32
            - 2405:b500::/32
            - 2405:8100::/32
            - 2a06:98c0::/29
            - 2c0f:f248::/32
      websecure:
        address: :443
        forwardedHeaders:
          trustedIPs: *trustedIPs
      metrics:
        address: :8082
      traefik:
        address: :8080

    providers:
      kubernetesCRD:
        allowCrossNamespace: true
      kubernetesIngress:
        allowExternalNameServices: true
        # Writes this Service into every served Ingress's status.loadBalancer. Without it
        # the field stays empty, which ArgoCD reads as "not healthy yet" - apps-production
        # sat at Progressing over three working Ingresses.
        ingressEndpoint:
          publishedService: ingress/traefik-external

    # No certificatesResolvers: TLS terminates at Cloudflare, nothing here names a
    # certResolver, and the old letsencrypt-internal block never issued a certificate. It
    # did make the pod require a `cloudflare-api-token` secret, which was deleted and broke
    # the next restart. Restore it, with the env var in deployment.yaml, only if traefik has
    # to terminate TLS itself - and with a real DNS API token, not the tunnel token.
    api:
      dashboard: true
      insecure: true

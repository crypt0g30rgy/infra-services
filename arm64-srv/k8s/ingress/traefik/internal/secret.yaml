# Cloudflare *DNS API* token for a DNS-01 ACME challenge - placeholder only, never commit the
# real value. Not `cloudflare-token` in cloudflared/secret.yaml, which is the tunnel token
# and cannot solve a DNS challenge.
#
# Nothing consumes this today: the `letsencrypt-internal` resolver it fed never issued a
# certificate, because TLS terminates at Cloudflare in front of the tunnel. Kept as the
# record of which credential ACME needs. To re-enable, in this order: apply a real token,
# then restore the resolver in internal/configmap.yaml and CF_DNS_API_TOKEN in
# base/deployment.yaml - secretKeyRef resolves at container start, so a missing secret takes
# ingress down at the next unrelated restart rather than when it goes missing.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: ingress
type: Opaque
stringData:
  api-token: <CLOUDFLARE_DNS_API_TOKEN>

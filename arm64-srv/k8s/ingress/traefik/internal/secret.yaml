# The Cloudflare *DNS API* token, for a DNS-01 ACME challenge. Placeholder in git, as it
# should be — the real value is never committed. Fill it in locally and apply, or point the
# key at External Secrets, but do not resolve it here.
#
# Nothing consumes this today, and that is deliberate. It fed the `letsencrypt-internal`
# ACME resolver, which had never issued a certificate: no Ingress or IngressRoute in the
# cluster names a certResolver, none declare `spec.tls`, and /data/acme/acme.json was still
# 0 bytes a month after it was created. Every hostname is fronted by the cloudflared
# tunnel, so TLS terminates at Cloudflare and traefik serves plaintext behind it. The
# manifest stays because it records which credential the ACME path needs; the *reference*
# to it in base/deployment.yaml is what was removed.
#
# A secretKeyRef is resolved once, when the container starts. When this secret went missing
# from the cluster traefik carried on serving for a day, and the next restart — for an
# unrelated config change — failed with CreateContainerConfigError and took ingress down.
# So: to re-enable ACME, restore the resolver in internal/configmap.yaml and the
# CF_DNS_API_TOKEN env var in base/deployment.yaml *and* make sure a real token is applied
# first, in that order.
#
# Not to be confused with `cloudflare-token` in cloudflared/secret.yaml. That one is the
# *tunnel* token, a different credential in the same namespace, and it will not solve a DNS
# challenge.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: ingress
type: Opaque
stringData:
  api-token: <CLOUDFLARE_DNS_API_TOKEN>

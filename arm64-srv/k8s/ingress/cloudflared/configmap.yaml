apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: ingress
data:
  config.yml: |
    tunnel: <tunnel-id>

    ingress:
      - hostname: "example.com"
        service: http://traefik-external.ingress.svc.cluster.local:80

      - hostname: "*.example.com"
        service: http://traefik-external.ingress.svc.cluster.local:80
        
      - hostname: "example.net"
        service: http://traefik-external.ingress.svc.cluster.local:80

      - hostname: "*.example.net"
        service: http://traefik-external.ingress.svc.cluster.local:80

      - service: http_status:404
# Longhorn Helm values. Replaces the microk8s hostpath provisioner - not for
# redundancy (one replica, see below) but so a volume is reachable over iSCSI from
# either node instead of pinning its workload to one machine.
#
#   helm upgrade --install longhorn longhorn/longhorn \
#     --namespace longhorn-system --create-namespace \
#     --version 1.12.1 -f arm64-srv/k8s/longhorn/values.yaml
#
# Node prerequisites and the migration procedure are in README.md here. If
# charts.longhorn.io is blocked, the chart is also in the tagged source tree under
# chart/.

csi:
  # Down from the chart's 3, which assumes 3+ nodes: on two nodes that was 12
  # leader-electing pods, and the parallel pulls tripped Docker Hub's anonymous
  # rate limit. Two still survives losing a node.
  attacherReplicaCount: 2
  provisionerReplicaCount: 2
  resizerReplicaCount: 2
  snapshotterReplicaCount: 2

  # microk8s only symlinks /var/lib/kubelet; give the CSI plugin the real path so
  # bidirectional mount propagation is not relying on the symlink.
  kubeletRootDir: /var/snap/microk8s/common/var/lib/kubelet

persistence:
  createStorageClass: true
  # The cluster default since the last hostpath PVC was migrated, so a PVC with no
  # storageClassName no longer lands on a directory on the pi. Two default classes
  # is an error state, so the addon's own annotation was removed by hand:
  #
  #   kubectl annotate sc microk8s-hostpath \
  #     storageclass.kubernetes.io/is-default-class-
  defaultClass: true
  defaultClassReplicaCount: 1
  # A deleted PVC must not take the data with it. Do not change.
  reclaimPolicy: Retain
  defaultDataLocality: disabled

defaultSettings:
  # Only nodes labelled node.longhorn.io/create-default-disk=true hold storage,
  # which is dell alone. The pi is excluded on purpose: its root filesystem is a
  # >90%-full microSD card also carrying the control plane. It still attaches
  # volumes normally, it just hosts no replicas.
  #
  #   kubectl label node dell-amd64-srv node.longhorn.io/create-default-disk=true
  createDefaultDiskLabeledNodes: true
  defaultDataPath: /var/lib/longhorn

  # ONE replica, because only one node has a disk - no redundancy, same as hostpath
  # gave. Label a second disk and raise this to 2 and Longhorn rebuilds online.
  # Until then a single disk failure loses the volume, so take backups.
  defaultReplicaCount: 1

  # Hard anti-affinity: with one storage node a 2-replica volume goes Degraded
  # instead of quietly stacking both copies on the same disk.
  replicaSoftAntiAffinity: false

  storageMinimalAvailablePercentage: 15
  storageOverProvisioningPercentage: 100

  # guaranteedInstanceManagerCPU stays at the chart default of 12 (% of capacity),
  # which suits dell - it holds every replica. The pi cannot pay 480m and had its
  # instance-manager rejected with OutOfcpu, which blocks *any* volume attaching to
  # a pod there (the engine runs where the pod is). Fixed per-node after install;
  # this is a CR field, not a Helm value:
  #
  #   kubectl patch nodes.longhorn.io -n longhorn-system pi-5-16gb-srv-0 \
  #     --type=merge -p '{"spec":{"instanceManagerCPURequest":200}}'
  #
  # A request with no limit, so engines still burst. Raise it when something large
  # leaves the pi.

  # Guard rail: uninstalling with volumes present needs this true first. Leave off.
  deletingConfirmationFlag: false

longhornUI:
  # One UI pod. There is nothing stateful about it and this is a homelab.
  replicas: 1

apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
# This account had no role bound for a long time, so kubernetes_sd_configs discovered
# nothing ("pods is forbidden ... at the cluster scope"), promtail tailed no files, and Loki
# got no pod logs - while staying Running and Ready, with the error logged once per watch
# retry under thousands of unrelated positions-write failures.
#
# Cluster scope rather than a Role because discovery lists pods in every namespace, and
# read-only on pods only: log content comes off the node filesystem, not the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring
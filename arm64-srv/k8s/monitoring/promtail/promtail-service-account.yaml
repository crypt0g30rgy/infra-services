apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: monitoring
---
# This account existed with no role bound to it at all, so promtail's
# `kubernetes_sd_configs` discovered nothing:
#
#   pods is forbidden: User "system:serviceaccount:monitoring:promtail"
#   cannot list resource "pods" in API group "" at the cluster scope
#
# With no targets it tailed no files, which is why its positions file was
# `positions: {}` and why Loki has had no pod logs from this cluster. The error
# was invisible for as long as it was: it is logged once per watch retry, buried
# under thousands of positions-write failures from the missing /run/promtail
# mount, and promtail stays Running and Ready throughout.
#
# Cluster scope, not a Role: service discovery lists pods in every namespace.
# Read-only on pods and nothing else - the log content itself comes off the node
# filesystem through the hostPath mounts, not the API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: monitoring
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: monitoring
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0

    positions:
      filename: /run/promtail/positions.yaml

    clients:
      - url: http://loki:3100/loki/api/v1/push

    scrape_configs:

    - job_name: kubernetes-pods

      kubernetes_sd_configs:
      - role: pod

      # `cri`, not `docker`: microk8s runs containerd, so lines on disk are
      # `<ts> stdout F <msg>`. With the docker stage nothing parsed, so every line kept
      # its ts/stream prefix, had promtail's read time as its timestamp, and came out
      # detected_level="unknown". The `json` stage that followed went too - its
      # expressions were nginx field names nothing here emits.
      pipeline_stages:
      - cri: {}

      # Strip ANSI colour: Nest's logger colourises even when not on a terminal, which
      # Grafana renders as literal `[32m`, breaks Loki's level detection, and makes line
      # filters guess where the escapes fall. Cheaper here than in thirteen services.
      # The whole pattern must be a capture group - replace substitutes groups, so an
      # expression without one changes nothing.
      - replace:
          expression: '(\x1b\[[0-9;]*m)'
          replace: ''

      relabel_configs:

      # Required: `role: pod` discovers the whole cluster and promtail keeps only
      # targets whose __host__ matches its own hostname, so unset means every target
      # dropped on both nodes - silently, since a promtail tailing nothing stays Ready.
      # Pairs with HOSTNAME in promtail-daemonset.yaml, which must be the NODE name.
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: __host__

      # namespace
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

      # pod name
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod

      # container name
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container

      # node
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: node

      # pod IP
      - source_labels: [__meta_kubernetes_pod_ip]
        target_label: pod_ip

      # workload name
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app

      # deployment
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: workload

      # controller name
      - source_labels: [__meta_kubernetes_pod_controller_name]
        target_label: controller

      # pod UID
      - source_labels: [__meta_kubernetes_pod_uid]
        target_label: pod_uid

      # container image
      - source_labels: [__meta_kubernetes_pod_container_image]
        target_label: image

      # log file path
      - source_labels: [__meta_kubernetes_pod_container_name]
        target_label: container

      - replacement: /var/log/pods/*$1/*.log
        separator: /
        source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
        target_label: __path__
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      containers:
      - name: promtail
        image: grafana/promtail:3.6.11
        imagePullPolicy: IfNotPresent
        args:
          - -config.file=/etc/promtail/promtail.yaml
        env:
        # The node name, which the `__host__` relabel in promtail-configmap.yaml is matched
        # against. Unset, promtail uses the pod name, matches no node, and tails nothing.
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: config
          mountPath: /etc/promtail
        # positions.yaml, per promtail-configmap.yaml. Without the mount the directory does
        # not exist, so every offset write failed (2332 in 12 hours per pod) and each
        # restart re-read or skipped whole files - the source of Loki's gaps and duplicates.
        - name: positions
          mountPath: /run/promtail
        - name: varlog
          mountPath: /var/log
        - name: containers
          mountPath: /var/lib/docker/containers
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: promtail-config
      # hostPath, not emptyDir - an emptyDir loses the offsets with the pod and reproduces
      # the same gaps silently, since the writes succeed. DirectoryOrCreate: /run/promtail
      # does not exist on a fresh node.
      - name: positions
        hostPath:
          path: /run/promtail
          type: DirectoryOrCreate
      - name: varlog
        hostPath:
          path: /var/log
      # Vestigial: containerd, so /var/lib/docker exists on neither node and __path__ reads
      # /var/log/pods. Kept only to avoid bundling its removal with the positions fix.
      - name: containers
        hostPath:
          path: /var/lib/docker/containers
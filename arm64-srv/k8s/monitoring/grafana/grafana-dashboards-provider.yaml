# Where the file-provisioned dashboards are. The JSON lives in the grafana-dashboard-*.yaml
# ConfigMaps, projected into /etc/grafana/dashboards - outside /var/lib/grafana on purpose,
# so a dashboard is never half-owned by a ConfigMap and the database.
#
# allowUiUpdates is false because these are code: a UI edit is silently reverted on the next
# directory reload. Use "Save as copy" (copies persist in the database) or edit the
# ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: platform
        orgId: 1
        folder: Platform
        type: file
        disableDeletion: false
        allowUiUpdates: false
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/dashboards
          foldersFromFilesStructure: false

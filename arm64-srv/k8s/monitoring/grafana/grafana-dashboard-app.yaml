# The per-service dashboard, file-provisioned into the "Platform" folder. Built on what the
# services send through the otel collector: spanmetrics from their traces plus the Node
# auto-instrumentation's HTTP, pg and runtime metrics.
#
# The same service is keyed by two label names: `service_name` on traces_span_metrics_*,
# and `exported_job` on http_*/db_*/nodejs_*/v8js_* (the prometheus exporter renames OTLP's
# `job` to avoid colliding with prometheus's own, which is always `otel-collector` here).
# $service matches both, with "All" as `.+` not `.*`, since `.*` also matches series that
# have no `exported_job`. Traces are in Jaeger (link at the top) and collector pipeline
# health is on the cluster dashboard, because a blank panel here and a broken exporter look
# the same from this side.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-app
  namespace: monitoring
data:
  apps.json: |
    {
      "uid": "platform-apps",
      "title": "Platform \u2014 Services",
      "description": "Per-service behaviour, from the traces and metrics the services export through the otel collector. Two label names to know: spanmetrics (traces_span_metrics_*) key the service as `service_name`, and everything from the Node instrumentation keys it as `exported_job`. The $service variable is applied to both. Node, volume and pipeline health is on \"Platform \u2014 Cluster\".",
      "tags": [
        "platform",
        "services",
        "otel"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "templating": {
        "list": [
          {
            "name": "service",
            "label": "Service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(traces_span_metrics_calls_total, service_name)",
            "query": {
              "query": "label_values(traces_span_metrics_calls_total, service_name)",
              "refId": "service-variable",
              "qryType": 1
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": [],
            "hide": 0,
            "skipUrlSync": false
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "links": [
        {
          "title": "Platform \u2014 Cluster",
          "type": "dashboards",
          "tags": [
            "cluster"
          ],
          "asDropdown": false,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "tooltip": "",
          "url": ""
        },
        {
          "title": "Traces (Jaeger)",
          "type": "link",
          "tags": [],
          "asDropdown": false,
          "icon": "doc",
          "includeVars": false,
          "keepTime": false,
          "targetBlank": true,
          "tooltip": "Search traces in Explore",
          "url": "/explore?left=%7B%22datasource%22:%22jaeger%22%7D"
        }
      ],
      "panels": [
        {
          "type": "row",
          "title": "Requests (from spans)",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "type": "stat",
          "title": "Request rate",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(traces_span_metrics_calls_total{service_name=~\"$service\", span_kind=\"SPAN_KIND_SERVER\"}[$__rate_interval]))",
              "legendFormat": "rps",
              "editorMode": "code",
              "range": true,
              "instant": false
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "mappings": [],
              "unit": "reqps",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "description": "Server spans per second, from the collector's spanmetrics connector. Counts every entry point - HTTP and RMQ consumers alike.",

# Loki's static config. Exists because loki-pvc.yaml does: the image's built-in
# local-config.yaml has no retention, which is fine on a container filesystem wiped every
# restart but fills a persistent volume, and a full /loki wedges the ingester instead of
# dropping old data. Paths and schema are copied from what the process was already running
# (checked against its /config endpoint) so existing chunks stay readable; retention and a
# quieter log level are the additions.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      # Not the default `info`: that is one ~2 KB line per subquery, which promtail ships
      # straight back in, so a dashboard on a refresh timer becomes loki's busiest tenant.
      # Back to info temporarily to debug a slow query - the timings are in those lines.
      log_level: warn

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      # Single binary, single replica - the ring is in memory and nothing joins it.
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    # As the process was already running it. Never edit an entry in place - schema changes
    # are appended with a future `from` date; rewriting this one makes loki look for
    # existing indexes under a layout they were never written in.
    schema_config:
      configs:
        - from: "2020-10-24"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    compactor:
      working_directory: /loki/compactor
      # Without this the compactor never deletes and `retention_period` is silently
      # ignored. `delete_request_store` becomes mandatory once retention is on.
      retention_enabled: true
      delete_request_store: filesystem
      compaction_interval: 10m
      retention_delete_delay: 2h

    limits_config:
      # 30 days. At ~20 MB/day that is under 1Gi of the 5Gi volume, so time is the binding
      # limit rather than disk - check `df -h /loki` before raising it.
      retention_period: 720h
      # Answers Grafana's log-volume histogram and rate() panels from the index instead of
      # by reading chunks.
      volume_enabled: true
      reject_old_samples: true
      reject_old_samples_max_age: 168h

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    # There is no alertmanager here. Left pointing at the default nowhere-address on purpose,
    # so adding alerting later is a one-line change.
    ruler:
      alertmanager_url: http://localhost:9093

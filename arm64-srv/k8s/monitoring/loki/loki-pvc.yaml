# /loki is everything Loki has: WAL, TSDB index, chunks, compactor workdir, ruler state.
# Before this claim it all sat on the container's writable layer, so 54 pod restarts each
# silently discarded every log line - promtail keeps pushing and Grafana just shows an empty
# range.
#
# 5Gi is deliberate headroom: ~20 MB/day compressed means the 30-day retention in
# loki-configmap.yaml needs well under 1Gi. Two Longhorn replicas, so this reserves 5Gi on
# both nodes, and the class is Retain - deleting the PVC leaves the data for a human.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi

networks:
  proxy:
    external: true
  internal:
    external: true
  ci-cd:
    external: true
  dashboards:
    external: true
services:
  # -------------------------
  # Cloudflare Tunnel
  # -------------------------
  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    container_name: cloudflared
    restart: unless-stopped
    networks:
      - proxy
      - internal
      - ci-cd
      - dashboards
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    labels:
      - "traefik.enable=false"  # disable traefik for this container

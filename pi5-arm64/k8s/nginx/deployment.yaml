---
apiVersion: v1
kind: Namespace
metadata:
  name: webtest
  
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: webtest
  labels:
    app: nginx
spec:
  containers:
    - name: nginx
      image: nginx:1.27
      ports:
        - containerPort: 80
          name: nginx-http
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: webtest
spec:
  type: ClusterIP
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: webtest
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: ingress-cluster-identity-header@kubernetescrd
spec:
  ingressClassName: public
  rules:
    - host: testing.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-service
                port:
                  number: 80
---
# Middleware: adds a custom header to every response so clients/debugging
# tools can tell the response came from this k8s cluster's Traefik.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cluster-identity-header
  namespace: ingress
spec:
  headers:
    customResponseHeaders:
      X-Routed-By: "k8s-cluster"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  namespace: ingress
data:
  traefik.yaml: |
    log:
      level: INFO
      format: json

    accessLog:
      filePath: /var/log/traefik/access.log
      format: json
      bufferingSize: 100
      filters:
        statusCodes:
          - "400-599"
        retryAttempts: true
        minDuration: "10ms"
      fields:
        defaultMode: keep
        names:
          ClientUsername: drop
        headers:
          defaultMode: drop
          names:
            User-Agent: keep
            X-Forwarded-For: keep
            X-Request-Id: keep
            Authorization: drop
            Cookie: drop

    metrics:
      prometheus:
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        buckets:
          - 0.1
          - 0.3
          - 1.2
          - 5.0
        entryPoint: metrics

    tracing:
      otlp:
        grpc:
          endpoint: jaeger.observability.svc.cluster.local:4317
          insecure: true

    ping:
      entryPoint: traefik
      terminatingStatusCode: 204   # signals graceful shutdown to k8s probes cleanly instead of a 503

    entryPoints:
      web:
        address: :80
        forwardedHeaders:
          # cloudflared runs as an in-cluster pod and passes through the
          # X-Forwarded-For / CF-Connecting-IP headers Cloudflare's edge already
          # set. Trusting Cloudflare's public IP ranges does nothing here, since
          # the TCP connection Traefik actually sees originates from the
          # cloudflared pod itself (an internal cluster IP). We trust the pod
          # network instead so Traefik reads the real client IP out of the header.
          #
          # CONFIRM this matches your actual pod CIDR:
          #   kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}'
          trustedIPs: &podCIDR
            - 10.1.0.0/16
      websecure:
        address: :443
        forwardedHeaders:
          trustedIPs: *podCIDR
      metrics:
        address: :8082
      traefik:
        address: :8080   # dashboard + /ping live here; defining entryPoints explicitly
                          # overrides Traefik's implicit default, so this must be declared

    providers:
      kubernetesCRD: {}
      kubernetesIngress: {}

    api:
      dashboard: true
      insecure: true

---
# ServiceAccount + RBAC: Traefik needs to watch Ingress/IngressRoute/Service/Endpoint resources
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: ingress

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
  - apiGroups: ["traefik.io"]
    resources:
      - middlewares
      - middlewaretcps
      - ingressroutes
      - traefikservices
      - ingressroutetcps
      - ingressrouteudps
      - tlsoptions
      - tlsstores
      - serverstransports
      - serverstransporttcps
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: ingress

---
# Deployment: Traefik + logrotate sidecar sharing the log volume
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: ingress
  labels:
    app: traefik
    app.kubernetes.io/name: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app: traefik
        app.kubernetes.io/name: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.7.9
          args:
            - --configfile=/etc/traefik/traefik.yaml
          ports:
            - name: web
              containerPort: 80
            - name: websecure
              containerPort: 443
            - name: metrics
              containerPort: 8082
            - name: dashboard
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/traefik
            - name: logs
              mountPath: /var/log/traefik
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20

        # Rotates /var/log/traefik/access.log so it doesn't fill node disk.
        # Traefik itself never rotates its own log file.
        #
        # NOTE: blacklabelops/logrotate was replaced here — its ancient Go
        # runtime crashes with "failed to create new OS thread (errno=22)"
        # on cgroup-constrained nodes (common on microk8s). Plain alpine +
        # the real logrotate binary avoids that entirely.
        - name: logrotate
          image: alpine:3.24
          command:
            - /bin/sh
            - -c
            - |
              apk add --no-cache logrotate >/dev/null 2>&1
              cat > /etc/logrotate.conf <<'EOF'
              /var/log/traefik/access.log {
                su root root
                rotate 7
                missingok
                nocompress
                copytruncate
                daily
                size 100M
              }
              EOF
              while true; do
                logrotate -f /etc/logrotate.conf --state /tmp/logrotate.state
                sleep 86400
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: logs
              mountPath: /var/log/traefik

      volumes:
        - name: config
          configMap:
            name: traefik-config
        - name: logs
          emptyDir: {}
          # Swap emptyDir for a PVC below if logs must survive pod restarts/rescheduling:
          # persistentVolumeClaim:
          #   claimName: traefik-logs-pvc

---
# Service: main entrypoints (web/websecure) + metrics
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: ingress
  labels:
    app: traefik
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local   # preserves real client source IP; without this
                                  # kube-proxy SNATs every request to a node-internal IP
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
    - name: websecure
      port: 443
      targetPort: 443

---
apiVersion: v1
kind: Service
metadata:
  name: traefik-metrics
  namespace: ingress
  labels:
    app: traefik
spec:
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: metrics
      port: 8082
      targetPort: 8082

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: traefik
  namespaceSelector:
    matchNames:
      - ingress
  endpoints:
    - port: metrics
      interval: 15s

---
# Required for ingressClassName: traefik to be recognized by Traefik.
# (Separate from the "public" IngressClass used by webtest — this Ingress
# references a differently-named class, so it needs its own IngressClass object.)
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
spec:
  controller: traefik.io/ingress-controller

---
# Required for ingressClassName: public to be recognized by Traefik.
# Without this, the Ingress below is silently ignored — Traefik only
# processes Ingresses whose class controller matches traefik.io/ingress-controller.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: public
spec:
  controller: traefik.io/ingress-controller
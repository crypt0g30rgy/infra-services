apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: ingress
  labels:
    app: traefik
    app.kubernetes.io/name: traefik
spec:
  replicas: 1
  # One replica holding an RWO longhorn volume (`traefik-data`, the ACME store), so the
  # surge has to be zero: with maxSurge 1 / maxUnavailable 0 the replacement pod is
  # created while the old one still holds the volume, and if the scheduler puts it on the
  # other node it waits on a Multi-Attach error forever. The old pod keeps serving, so
  # that failure mode is a rollout that never finishes rather than an outage — which is
  # worse, because it is silent. Stopping first costs a few seconds of ingress downtime on
  # every config change, which is the honest price of a single-replica ingress.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app: traefik
        app.kubernetes.io/name: traefik
    spec:
      serviceAccountName: traefik
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 65532
      initContainers:
        # /data/logs is gone from here: the access log goes to stdout now, so nothing writes
        # into that directory. /data/acme stays, empty and mode 700, because it is where the
        # ACME store goes if the resolver in traefik.yaml is ever restored - and creating it
        # after the fact means getting the ownership right by hand on a live volume.
        - name: init-dirs
          image: alpine:3.24
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /data/acme
              chown -R 65532:65532 /data
              chmod 700 /data/acme
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: traefik
          image: traefik:v3.7.11
          args:
            - --configfile=/etc/traefik/traefik.yaml
          # No env. There used to be a CF_DNS_API_TOKEN here, read from a
          # `cloudflare-api-token` secret, for the ACME dnsChallenge resolver that has now
          # been removed from traefik.yaml — see the comment there for why (nothing
          # requests a certResolver; TLS terminates at Cloudflare).
          #
          # That secret no longer exists in the cluster. A running pod resolves secretKeyRef
          # once, at start, so traefik went on serving for a day after it was deleted and
          # the first restart after that failed with CreateContainerConfigError — ingress
          # down, for a credential that was feeding a code path with no callers. An env var
          # nobody uses is not free: it is a landmine armed on the next restart.
          ports:
            - name: web
              containerPort: 80
            - name: websecure
              containerPort: 443
            - name: metrics
              containerPort: 8082
            - name: dashboard
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/traefik
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

        # No logrotate sidecar. There was one - a plain-shell size-capped rotator, itself a
        # rewrite of a broken `apk add logrotate` version - and it is gone because the thing
        # it rotated is gone: traefik's accessLog now writes to stdout, so the log is the
        # kubelet's to rotate and Loki's to retain, and /data/logs is never created.
        #
        # This is worth spelling out because removing it looks like removing a safety
        # measure. It is the opposite: a rotator watching a file that will never again be
        # written cannot fire, so keeping it would have left the 287 MB of already-rotated
        # access.log.* on the volume permanently, under a sidecar that reported healthy while
        # doing nothing. Those files were deleted when this landed. If accessLog ever goes
        # back to a filePath, this comes back with it - and stdout is the reason the traefik
        # dashboard can query request paths and client IPs at all.

      volumes:
        - name: config
          configMap:
            name: traefik-config
        - name: data
          persistentVolumeClaim:
            claimName: traefik-data

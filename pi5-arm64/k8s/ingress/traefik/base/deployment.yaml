apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: ingress
  labels:
    app: traefik
    app.kubernetes.io/name: traefik
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app: traefik
        app.kubernetes.io/name: traefik
    spec:
      serviceAccountName: traefik
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 65532
      initContainers:
        - name: init-dirs
          image: alpine:3.24
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /data/logs /data/acme
              chown -R 65532:65532 /data
              chmod 700 /data/acme
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: traefik
          image: traefik:v3.7.9
          args:
            - --configfile=/etc/traefik/traefik.yaml
          env:
            - name: CF_DNS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-api-token
                  key: token
          ports:
            - name: web
              containerPort: 80
            - name: websecure
              containerPort: 443
            - name: metrics
              containerPort: 8082
            - name: dashboard
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/traefik
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

        # Rotates /data/logs/access.log. Deliberately plain shell rather than the
        # logrotate package, for two reasons that both bit the previous version:
        #
        #   * It used `apk add --no-cache logrotate >/dev/null 2>&1`, so on a node
        #     that cannot reach dl-cdn.alpinelinux.org (the pi - every Cloudflare
        #     IPv4 edge is unreachable from it) logrotate was never installed and
        #     the sidecar became a no-op that still reported Running.
        #   * Its config said `su 65532 65532`. logrotate resolves those through
        #     getpwnam/getgrnam, the alpine image has no such user or group, and
        #     it answered `unknown group '65532'` -> `skipping` -> `Handling 0
        #     logs`. So even on a node where the install worked it rotated
        #     nothing. access.log reached 287 MB on a 1 Gi volume this way.
        #
        # No package, no name lookup, nothing to install: it cannot fail that way
        # again, and it says what it did on stdout so the next failure is visible
        # in `kubectl logs`.
        - name: logrotate
          image: alpine:3.24
          # Not root. /data/logs is owned by 65532 and fsGroup makes it writable,
          # which is the whole reason the `su` directive existed - so drop both.
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          command:
            - /bin/sh
            - -c
            - |
              set -u
              LOG=/data/logs/access.log
              # 50 MiB x (1 live + 3 kept) plus one in-flight copy is ~250 MiB of
              # the 1 Gi volume. Raise both together, and against that number.
              MAX=$((50 * 1024 * 1024))
              KEEP=3
              # Every 5 minutes, not daily: a size cap checked once a day is not a
              # size cap. The old sidecar slept 86400 between attempts.
              INTERVAL=300

              while true; do
                if [ -f "$LOG" ]; then
                  SIZE=$(wc -c < "$LOG")
                  if [ "$SIZE" -gt "$MAX" ]; then
                    echo "$(date -Iseconds) rotating $LOG ($SIZE bytes)"
                    i=$KEEP
                    while [ "$i" -gt 1 ]; do
                      p=$((i - 1))
                      [ -f "$LOG.$p" ] && mv "$LOG.$p" "$LOG.$i"
                      i=$p
                    done
                    # copy-then-truncate, i.e. logrotate's copytruncate. traefik
                    # holds this file open and is not signalled, so the inode has
                    # to stay put; mv would leave it writing to a file no longer
                    # named anything. The writes between cp and truncate are lost
                    # - that trade is inherent to copytruncate and is why the
                    # window is kept to one copy.
                    if cp "$LOG" "$LOG.1"; then
                      : > "$LOG"
                      echo "$(date -Iseconds) rotated; kept $LOG.1..$LOG.$KEEP"
                    else
                      echo "$(date -Iseconds) copy FAILED, leaving $LOG alone" >&2
                    fi
                  fi
                fi
                sleep "$INTERVAL"
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data

      volumes:
        - name: config
          configMap:
            name: traefik-config
        - name: data
          persistentVolumeClaim:
            claimName: traefik-data

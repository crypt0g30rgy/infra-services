apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  namespace: ingress
data:
  traefik.yaml: |
    log:
      level: INFO
      format: json

    # stdout, not a file. Three things follow from that, and all three are the point:
    #
    #   * promtail tails container stdout out of /var/log/pods, so the access log now
    #     reaches Loki and can be queried. While it went to /data/logs/access.log on an RWO
    #     longhorn volume nothing could read it but a `kubectl exec` - which is why traefik's
    #     request paths and client IPs were invisible in Grafana while traefik's own
    #     prometheus metrics (which have no label for either, by design - both are unbounded
    #     cardinality) were the only thing available. The traefik dashboard's "top paths" and
    #     "top client IPs" panels are Loki queries against these lines.
    #   * The volume stops being a place logs accumulate. access.log had reached 287 MB on a
    #     1 Gi volume once already, and the logrotate sidecar that fixed that has been
    #     removed along with this filePath - there is nothing left for it to rotate.
    #   * Retention becomes Loki's 30 days instead of the sidecar's "3 files of 50 MiB".
    #
    # No `bufferingSize`. It was 100, meaning up to 100 entries were held in memory before
    # being written; at this cluster's request rate that is minutes of delay before a line
    # appears, which is fine for a file nobody reads and useless for a dashboard.
    #
    # No `filters` either, and that is the substantive change. They were:
    #     statusCodes: 400-599 / retryAttempts: true / minDuration: 10ms
    # which are OR'd, so a request was logged if it failed OR was retried OR took longer
    # than 10ms - and dropped otherwise. Fast successful requests were therefore absent, so
    # any per-path or per-IP count taken from these lines was a count of *slow and failed*
    # requests wearing the label "requests". A top-talkers panel built on that is worse than
    # no panel. The cost of logging everything is about 17 MB/day of raw JSON at current
    # volume - single-digit MB/day once Loki compresses it, against a 5 Gi claim.
    #
    # `format: json` is load-bearing now: every Loki query here starts with `| json`.
    accessLog:
      format: json
      fields:
        defaultMode: keep
        names:
          ClientUsername: drop
        headers:
          defaultMode: drop
          names:
            User-Agent: keep
            X-Forwarded-For: keep
            X-Request-Id: keep
            Authorization: drop
            Cookie: drop

    metrics:
      prometheus:
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        buckets:
          - 0.1
          - 0.3
          - 1.2
          - 5.0
        entryPoint: metrics

    # There is no `observability` namespace in this cluster and there never has been - the
    # endpoint here was `jaeger.observability.svc.cluster.local:4317`, which does not resolve,
    # so every span traefik has produced was dropped at the exporter. It looked configured.
    # The access log has carried a real TraceId on every line the whole time, and following
    # one into Jaeger found nothing, because the entry span was never delivered: traces
    # started at api-gw, missing the hop that says how long the ingress itself took.
    #
    # Now the collector in `monitoring`, not jaeger directly, which is where every service
    # sends its traces. Same reasons as for them: the collector is the only thing that
    # derives spanmetrics, so traefik's spans become RED metrics too, and it batches and
    # retries where a direct exporter drops on the floor when jaeger restarts.
    tracing:
      otlp:
        grpc:
          endpoint: otel-collector.monitoring.svc.cluster.local:4317
          insecure: true

    ping:
      entryPoint: traefik
      terminatingStatusCode: 204

    entryPoints:
      # forwardedHeaders.trustedIPs decides, per peer, whether traefik *appends* to
      # X-Forwarded-For or *replaces* it with the socket address. That single choice is what
      # every rate limit, internal-traffic exemption and audit field downstream keys on:
      #
      #   peer in this list      -> append, so the client address Cloudflare wrote survives
      #   peer not in this list  -> replace, so a caller cannot state their own address
      #
      # Both paths into this cluster are covered:
      #
      #   tunnelled  client -> Cloudflare -> cloudflared (in-cluster pod) -> traefik
      #              traefik's peer is the cloudflared pod, so 10.1.0.0/16 is what makes it
      #              work. This is the only path in use today: cloudflared's config.yml
      #              routes xboy.me, tdi.solutions and both wildcards to
      #              traefik-external.ingress.svc.cluster.local, and traefik-external is a
      #              LoadBalancer on 192.168.1.201 — a LAN address, not publicly routable.
      #   proxied    client -> Cloudflare -> traefik
      #              traefik's peer is a Cloudflare edge address, which is why the ranges
      #              below are here. Without them traefik replaces X-Forwarded-For with the
      #              edge address and every caller behind one Cloudflare PoP collapses into a
      #              single rate-limit bucket. Inert until a DNS record is pointed at a
      #              publicly reachable origin instead of the tunnel — at which point it is
      #              load-bearing, and the failure is silent.
      #
      # api-gw already holds up the matching half: TRUSTED_PROXY_IPS is
      # "loopback,uniquelocal,cloudflare" in config-svc's api-gw-svc/.env.production, where
      # uniquelocal covers traefik's own pod address and the cloudflare token expands to the
      # same published ranges, fetched at boot.
      #
      # NEVER put 0.0.0.0/0 here, and never widen this to a range the platform does not
      # control: that hands any caller the ability to state their own address, which is the
      # rate-limit bypass this list exists to prevent.
      #
      # The list is Cloudflare's published edge ranges from
      # https://api.cloudflare.com/client/v4/ips, retrieved 2026-08-25. It changes rarely but
      # it does change, and traefik cannot fetch it — static config is read once at start.
      # Re-check it when touching this file; api-gw's copy refreshes itself and this one does
      # not, so this is the half that goes stale.
      web:
        address: :80
        forwardedHeaders:
          # Anchored and aliased by websecure below: the two entrypoints must agree, and
          # keeping one copy is what stops them drifting apart.
          trustedIPs: &trustedIPs
            - 10.1.0.0/16
            # Cloudflare IPv4
            - 173.245.48.0/20
            - 103.21.244.0/22
            - 103.22.200.0/22
            - 103.31.4.0/22
            - 141.101.64.0/18
            - 108.162.192.0/18
            - 190.93.240.0/20
            - 188.114.96.0/20
            - 197.234.240.0/22
            - 198.41.128.0/17
            - 162.158.0.0/15
            - 104.16.0.0/13
            - 104.24.0.0/14
            - 172.64.0.0/13
            - 131.0.72.0/22
            # Cloudflare IPv6
            - 2400:cb00::/32
            - 2606:4700::/32
            - 2803:f800::/32
            - 2405:b500::/32
            - 2405:8100::/32
            - 2a06:98c0::/29
            - 2c0f:f248::/32
      websecure:
        address: :443
        forwardedHeaders:
          trustedIPs: *trustedIPs
      metrics:
        address: :8082
      traefik:
        address: :8080

    providers:
      kubernetesCRD:
        allowCrossNamespace: true
      kubernetesIngress:
        allowExternalNameServices: true
        # Write this Service's address back into the `status.loadBalancer` of every
        # Ingress traefik serves. Without it traefik routes the Ingress perfectly and
        # never touches its status, which stays empty — and an Ingress with an empty
        # `status.loadBalancer.ingress` is what ArgoCD reads as "not healthy yet", so
        # `apps-production` sat at Progressing indefinitely over three working
        # Ingresses. Nothing else consumes the field here; this exists to stop
        # permanent yellow in the ArgoCD UI, which is how a real regression gets missed.
        ingressEndpoint:
          publishedService: ingress/traefik-external

    # No certificatesResolvers. There was a `letsencrypt-internal` ACME resolver here,
    # DNS-01 through Cloudflare, and it had never issued a certificate: no Ingress or
    # IngressRoute in the cluster names a certResolver, none of them declare `spec.tls`,
    # and /data/acme/acme.json was still 0 bytes a month after it was created. Every
    # hostname is fronted by the cloudflared tunnel, so TLS terminates at Cloudflare and
    # traefik only ever serves plaintext behind it.
    #
    # What the block did do was make the deployment require a `cloudflare-api-token`
    # secret. That secret was deleted; traefik kept running because it had already
    # resolved the env var, and the next restart - a day later, for an unrelated config
    # change - could not create the container at all. Restore this together with the env
    # var in deployment.yaml if the tunnel is ever removed and traefik has to terminate
    # TLS itself, and give it a real DNS API token (`cloudflare-token` in this namespace
    # is the cloudflared *tunnel* token, which is a different credential and will not
    # solve a DNS challenge).
    api:
      dashboard: true
      insecure: true

# SUPERSEDED - see vault-warden/s3-backup-job.yaml.
#
# This CronJob is not deployed. `kubectl -n vaultwarden get cronjob` lists only
# `vaultwarden-backup`, which is the one in vault-warden/s3-backup-job.yaml, and
# that one already dumps this same database (plus tars /data) at 00:00 UTC. Two
# CronJobs backing up one server to one bucket is not redundancy - it is two
# things to keep in step.
#
# It has been converted onto the shared backup image rather than left as it was,
# so that applying it is at least safe if anyone ever does, but the intent is to
# delete this directory - this file and rbac.yml, which exists only to grant the
# kubectl access below that is no longer needed. Nothing else references either.
#
# What the conversion changed, beyond the image:
#
#   * No `apt-get install` and no kubectl download. The image carries bash,
#     aws-cli, pg_dump 18.6, gzip, sha256sum, GNU date, awk and sed.
#   * No `kubectl exec` into the postgres pod. It connects to the Service like
#     any other client, which is what removed the ServiceAccount, the RBAC and
#     the `-l app=postgres` lookup that would break the day that label changes.
#   * That kubectl download was `linux/amd64` on a cluster whose pi node is
#     arm64, so this Job could only ever have run on the dell.
#   * Non-root, read-only root filesystem, no capabilities - possible only
#     because nothing is installed at runtime.
#
# What it still does differently from vault-warden/s3-backup-job.yaml, and why
# that file is the one to keep: this writes to the bucket root rather than under
# a prefix, uses `pg_dump -F c` for one database rather than pg_dumpall, does not
# read the upload back to verify it, and does not back up /data at all.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-pg-backup
  namespace: vaultwarden
spec:
  schedule: "0 2 * * *"  # daily at 02:00 UTC
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          containers:
            - name: pg-backup
              # Pinned by multi-arch *index* digest: this cluster is arm64 +
              # amd64 and a per-platform digest would be unpullable on one node.
              # Refresh with
              # `crane digest registry.internal.xboy.me/tools/s3-backup:2.0.0`.
              image: registry.internal.xboy.me/tools/s3-backup:2.0.0@sha256:9dd96606c8b5c53a442d62b1a869469fde9692bc6b7ce08804237387640f0a4e
              imagePullPolicy: IfNotPresent
              securityContext:
                runAsNonRoot: true
                runAsUser: 100
                runAsGroup: 101
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  echo "[0/8] Checking the image's tools"
                  # Nothing is installed at runtime. These checks turn a wrong
                  # image or a bad build into a failed Job rather than a Job that
                  # reports Complete having backed up nothing.
                  for tool in aws pg_dump pg_isready gzip sha256sum; do
                      command -v "$tool" >/dev/null || { echo "FATAL: $tool is not in the image" >&2; exit 1; }
                  done
                  aws --version
                  pg_dump --version

                  echo "[1/8] Waiting for PostgreSQL"
                  export PGHOST=postgres.vaultwarden.svc.cluster.local
                  export PGPORT=5432
                  export PGUSER="$POSTGRES_USER"
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  export PGCONNECT_TIMEOUT=15
                  n=0
                  until pg_isready -q; do
                      n=$((n + 1))
                      [ "$n" -lt 30 ] || { echo "FATAL: $PGHOST:$PGPORT not accepting connections after 60s" >&2; exit 1; }
                      sleep 2
                  done

                  TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
                  FILE="vaultwarden-${TIMESTAMP}.sql.gz"
                  CHECKSUM_FILE="${FILE}.sha256"
                  TMPFILE="/tmp/$FILE"

                  echo "[2/8] Dumping and compressing database..."
                  pg_dump -d "$POSTGRES_DB" -F c | gzip -c > "$TMPFILE"

                  echo "[3/8] Creating checksum..."
                  sha256sum "$TMPFILE" | awk '{print $1}' > "/tmp/$CHECKSUM_FILE"

                  echo "[4/8] Uploading backup to S3..."
                  aws s3 cp "$TMPFILE" "s3://${S3_BUCKET}/$FILE"
                  aws s3 cp "/tmp/$CHECKSUM_FILE" "s3://${S3_BUCKET}/$CHECKSUM_FILE"

                  echo "[5/8] Enforcing retention..."
                  aws s3 ls "s3://${S3_BUCKET}/" | awk '$4 ~ /vaultwarden-.*\.sql\.gz/ {print $4}' | while read OLD_FILE; do

                      FILE_DATE_RAW=$(echo "$OLD_FILE" | sed -E 's/vaultwarden-([0-9TZ]+).*/\1/')

                      # Normalize timestamp for GNU date
                      FILE_DATE_FMT="$(echo "$FILE_DATE_RAW" | sed -E \
                          's/([0-9]{4})([0-9]{2})([0-9]{2})T([0-9]{2})([0-9]{2})([0-9]{2})Z/\1-\2-\3 \4:\5:\6 UTC/')"

                      FILE_TS=$(date -d "$FILE_DATE_FMT" +%s)
                      CUTOFF=$(date -d "-${RETENTION_DAYS} days" +%s)

                      if [[ "$FILE_TS" -lt "$CUTOFF" ]]; then
                          echo "Deleting expired: $OLD_FILE"
                          aws s3 rm "s3://${S3_BUCKET}/$OLD_FILE"
                          aws s3 rm "s3://${S3_BUCKET}/${OLD_FILE}.sha256" || true
                      fi
                  done

                  echo "[6/8] Cleaning up local temp files..."
                  rm -f "$TMPFILE" "/tmp/$CHECKSUM_FILE"

                  echo "[7/8] Vaultwarden backup completed successfully!"
              env:
                # The AWS CLI keeps its config under $HOME, which with a
                # read-only root filesystem has to be the emptyDir.
                - name: HOME
                  value: /tmp
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-env
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-env
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_REGION
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-env
                      key: AWS_REGION
                - name: S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-env
                      key: S3_BUCKET
                - name: RETENTION_DAYS
                  valueFrom:
                    secretKeyRef:
                      name: s3-backup-env
                      key: RETENTION_DAYS
                # Connecting to the Service instead of `kubectl exec`ing into the
                # pod means this Job needs the database credentials of its own.
                # Same Secret the vaultwarden Deployment reads.
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: vaultwarden-secret
                      key: POSTGRES_USER
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: vaultwarden-secret
                      key: POSTGRES_PASSWORD
                - name: POSTGRES_DB
                  valueFrom:
                    secretKeyRef:
                      name: vaultwarden-secret
                      key: POSTGRES_DB
              volumeMounts:
                - name: work
                  mountPath: /tmp
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 4Gi

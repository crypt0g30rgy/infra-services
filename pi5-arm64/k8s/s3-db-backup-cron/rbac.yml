# SUPERSEDED - nothing uses this. It existed only so backup-cron.yml could
# `kubectl exec` into the postgres pod; that Job now connects to the Service
# instead, and it was never deployed in the first place. Delete alongside
# backup-cron.yml.
#
# Note also that the Role below does not grant what it looks like it grants:
# `exec` is a subresource, so the verb has to be `create` on `pods/exec`. As
# written, the ServiceAccount could list pods and nothing else - and the API
# server accepts the rule without complaint.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vaultwarden-backup
  namespace: vaultwarden
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vaultwarden-backup-role
  namespace: vaultwarden
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "exec"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vaultwarden-backup-rolebinding
  namespace: vaultwarden
subjects:
  - kind: ServiceAccount
    name: vaultwarden-backup
    namespace: vaultwarden
roleRef:
  kind: Role
  name: vaultwarden-backup-role
  apiGroup: rbac.authorization.k8s.io
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: registry
spec:
  replicas: 1

  selector:
    matchLabels:
      app: registry

  template:
    metadata:
      labels:
        app: registry

    spec:
      containers:
        - name: registry
          image: registry:3.1.1

          args:
            - serve
            - /etc/docker/registry/config.yml

          ports:
            - name: http
              containerPort: 5000

          env:
            - name: REGISTRY_HTTP_SECRET
              valueFrom:
                secretKeyRef:
                  name: registry-auth
                  key: registry-http-secret

          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30

          volumeMounts:
            - name: storage
              mountPath: /var/lib/registry

            - name: config
              mountPath: /etc/docker/registry

            - name: auth
              mountPath: /etc/docker/registry/auth
              readOnly: true

      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: registry-storage

        - name: config
          configMap:
            name: registry-config

        - name: auth
          secret:
            secretName: registry-auth
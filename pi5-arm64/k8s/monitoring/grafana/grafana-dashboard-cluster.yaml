              "type": "prometheus",
              "uid": "prometheus"
            },
            "definition": "label_values(machine_cpu_cores, node)",
            "query": {
              "query": "label_values(machine_cpu_cores, node)",
              "refId": "node-variable",
              "qryType": 1
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "options": [],
            "hide": 0,
            "skipUrlSync": false
          },
          {
            "name": "namespace",
            "label": "Log namespace",
            "type": "query",
            "datasource": {
              "type": "loki",
              "uid": "loki"
            },
            "definition": "label_values(namespace)",
            "query": "label_values(namespace)",
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".+",
            "current": {
              "text": [
                "All"
              ],

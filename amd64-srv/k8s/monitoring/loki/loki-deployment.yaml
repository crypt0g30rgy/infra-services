apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # Single replica on an RWO volume, so the replacement pod cannot be created while the old
  # one still holds it: with the default maxSurge 1 / maxUnavailable 0 the new pod waits on
  # a Multi-Attach error if the scheduler puts it on the other node, and the rollout hangs
  # instead of failing. Same reasoning as grafana and traefik.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
      annotations:
        # Roll the pod when the config changes. Loki reads its config once at start, and
        # nothing here is reconciled by ArgoCD, so without this a `kubectl apply` of the
        # ConfigMap is a change that appears to have landed and has not.
        checksum/config: "loki-config-v1-retention-720h"
    spec:
      # dell, with grafana and the rest of `monitoring`; see ../../../../k8s.md, "Node
      # placement". This was unpinned until 2026-09-07, which is not the same as "on the pi":
      # the pod landed wherever the scheduler put it, and `loki-data`'s only Longhorn replica
      # is now tagged to this node, so an unpinned pod that started on the pi would read and
      # write every chunk over the LAN. Keep this selector and the volume's `nodeSelector`
      # tag in step — loki-pvc.yaml says where the volume side of it lives.
      nodeSelector:
        kubernetes.io/hostname: dell-amd64-srv

      # The image runs as uid 10001 and the longhorn volume comes up owned by root, so
      # without fsGroup loki cannot create /loki/wal and crash-loops on
      # "mkdir /loki/wal: permission denied".
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        fsGroup: 10001
      containers:
      - name: loki
        image: grafana/loki:3.7.7
        imagePullPolicy: IfNotPresent
        args:
          - -config.file=/etc/loki/loki.yaml
        ports:
        - name: http
          containerPort: 3100
        - name: grpc
          containerPort: 9096
        # Measured, not guessed: RSS sits around 200Mi with ~20 MB/day of ingest and the
        # embedded 100Mi query cache. The limit is deliberately well above that - loki's
        # memory scales with the number of active streams, and promtail labels every pod in
        # the cluster, so a burst of new pods is a burst of streams.
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 1Gi
        # /ready, not /metrics: loki serves HTTP before the ingester has joined its own ring
        # and answers /ready with "Ingester not ready: waiting for 15s after being ready"
        # until it can actually accept a push. A probe on anything else marks it Ready while
        # promtail's pushes are still being refused.
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 60
          periodSeconds: 30
          # WAL replay after an unclean stop can take a while on a Longhorn volume, and a
          # liveness probe that kills loki mid-replay never lets it finish. The 6 was chosen
          # while this ran on the pi's SD card; it is headroom now rather than a necessity,
          # and it costs nothing.
          failureThreshold: 6
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        - name: data
          mountPath: /loki
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: data
        persistentVolumeClaim:
          claimName: loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: monitoring
spec:
  selector:
    app: loki
  ports:
  - name: http
    port: 3100
    targetPort: http

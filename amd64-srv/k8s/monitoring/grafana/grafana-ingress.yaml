# DO NOT APPLY THIS FILE AS-IS. The host below is a placeholder - this repo is public and
# the real name is not in it (see ../../../../README.md, "Hostnames here are placeholders").
# The live Ingress is `grafana.xboy.me`, and applying this replaces it with
# `grafana.example.com`: the pod stays healthy, the Ingress object stays green, and Grafana
# simply stops answering. `kubectl get ingress -n monitoring grafana` is the real value; edit
# the host here to match it in a temporary copy if you need to change anything else.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure

spec:
  ingressClassName: traefik
  rules:
    - host: grafana.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
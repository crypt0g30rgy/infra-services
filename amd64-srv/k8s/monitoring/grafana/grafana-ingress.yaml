# DO NOT APPLY THIS FILE AS-IS. The host below is a placeholder - this repo is public and
# the real name is not in it (see ../../../../README.md, "Hostnames here are placeholders").
# Applying this replaces the live host with `grafana.example.com`: the pod stays healthy, the
# Ingress object stays green, and Grafana simply stops answering.
# `kubectl get ingress -n monitoring grafana -o jsonpath='{.spec.rules[0].host}'` is the real
# value; substitute it into a temporary copy if you need to change anything else here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure

spec:
  ingressClassName: traefik
  rules:
    - host: grafana.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80
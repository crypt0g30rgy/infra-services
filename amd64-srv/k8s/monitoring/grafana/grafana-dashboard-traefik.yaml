# The ingress dashboard, file-provisioned into the "Platform" folder alongside the cluster
# and app dashboards. Two datasources, and the split is forced, not stylistic: traefik's
# prometheus metrics carry no request path and no client IP (unbounded cardinality), so
# every "top paths / clients / user agents" panel is LogQL over the access log instead.
# That is also why accessLog goes to stdout - promtail only tails stdout.
#
# Things that look wrong and are not: 404s dominate (the tunnel is scanned continuously,
# hence the dedicated 404 panels); `code="0"` is a websocket upgrade, not a status; latency
# appears twice because the histogram has four buckets, so percentiles land on bucket edges
# and the "exact" panels unwrap Duration from the log - the histogram survives Loki being
# down. Admin traffic is excluded by `entrypoint!~"metrics|traefik"` so a new public
# entrypoint appears here without an edit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-traefik
  namespace: monitoring
data:
  traefik.json: |
    {
      "uid": "platform-traefik",
      "title": "Platform \u2014 Ingress (traefik)",
      "description": "Every request into the cluster, from two sources that answer different questions. traefik's prometheus metrics are complete and cheap but carry no request path and no client IP - both are unbounded cardinality and traefik omits them on purpose. The access log in Loki has both. Panels are labelled with which one they came from; where they overlap (latency) the log is the exact figure and the histogram is the one that still works if Loki is down.",
      "tags": [
        "platform",
        "ingress",
        "traefik"
      ],
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "links": [
        {
          "type": "dashboards",
          "title": "Platform",
          "tags": [
            "platform"
          ],
          "asDropdown": true,
          "icon": "external link",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "tooltip": "",
          "url": ""
        }

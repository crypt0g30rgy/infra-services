            "options": [
              {
                "text": "5",
                "value": "5",
                "selected": false
              },
              {
                "text": "10",
                "value": "10",
                "selected": true
              },
              {
                "text": "20",
                "value": "20",
                "selected": false
              },
              {
                "text": "50",
                "value": "50",
                "selected": false
              }
            ],
            "current": {
              "text": "10",
              "value": "10",
              "selected": true
            },
            "includeAll": false,
            "multi": false,
            "hide": 0

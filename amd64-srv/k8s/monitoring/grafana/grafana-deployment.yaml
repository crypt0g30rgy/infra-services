apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # maxSurge 0 because the RWO claim cannot attach twice: a surged pod never becomes Ready,
  # so the rollout never finishes. Trades a few seconds of downtime for that. Not
  # `type: Recreate` - the live object already has a defaulted spec.strategy.rollingUpdate,
  # and switching type while it is set is rejected as Forbidden.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      # The amd64 box, with the rest of the infrastructure; see ../../../../k8s.md,
      # "Node placement".
      # The volume moves with it: SQLite's format is architecture-independent, unlike a
      # PostgreSQL data directory. Keep maxSurge 0 - two pods mean two RWO attach attempts.
      nodeSelector:
        kubernetes.io/arch: amd64

      # 472 is the image's `grafana` user; fsGroup is what makes a fresh Longhorn volume
      # writable by it, otherwise Grafana exits "unable to open database file".
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana:13.2.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        # Both are timed calls out to grafana.com (usage reporting, update checks) for
        # features nobody here uses - and grafana.com was one of the names timing out while
        # the resolver was struggling.
        - name: GF_ANALYTICS_REPORTING_ENABLED
          value: "false"
        - name: GF_ANALYTICS_CHECK_FOR_UPDATES
          value: "false"
        volumeMounts:
        # The SQLite database and anything built through the UI. See grafana-pvc.yaml.
        - name: data
          mountPath: /var/lib/grafana
        - name: datasources
          mountPath: /etc/grafana/provisioning/datasources
          readOnly: true
        - name: dashboards-provider
          mountPath: /etc/grafana/provisioning/dashboards
          readOnly: true
        - name: dashboards
          mountPath: /etc/grafana/dashboards
          readOnly: true
        # /api/health needs no auth and covers the database, not just the process - which
        # is the likely failure now that there is a volume to fail to mount.
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 5
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: datasources
        configMap:
          name: grafana-datasources
      - name: dashboards-provider
        configMap:
          name: grafana-dashboards-provider
      # Projected because each dashboard is its own ConfigMap (readable diffs, well inside
      # the 1 MiB limit) but they must land in one directory for a single provider to read
      # them. A new dashboard needs a ConfigMap *and* a source here - one that is applied
      # but unlisted is healthy and invisible.
      - name: dashboards
        projected:
          sources:
          - configMap:
              name: grafana-dashboard-cluster
          - configMap:
              name: grafana-dashboard-app
          - configMap:
              name: grafana-dashboard-traefik
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  selector:
    app: grafana
  ports:
  - port: 80
    targetPort: 3000

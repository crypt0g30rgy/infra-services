# Grafana's state: the SQLite database at /var/lib/grafana/grafana.db - admin password,
# users and API tokens, UI-built dashboards, annotations, alert rules and silences.
# Everything not provisioned from a file. Without this claim each pod restart handed back a
# factory-fresh Grafana, which is why the datasource used to be re-added by hand (it is a
# ConfigMap now). Class is longhorn/Retain, so deleting the PVC keeps the volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi

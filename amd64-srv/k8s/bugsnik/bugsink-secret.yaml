# Placeholders - NEVER applied, create both on the host. POSTGRES_PASSWORD must be
# identical in the two namespaces (one connection, no cross-namespace keyRef); hex,
# because it goes into DATABASE_URL and bugsink parses that with urlparse.
#
#   PGPW="$(openssl rand -hex 24)"
#   kubectl -n monitoring create secret generic bugsink-secret \
#     --from-literal=SECRET_KEY="$(openssl rand -base64 50)" \
#     --from-literal=POSTGRES_PASSWORD="$PGPW"
#   kubectl -n data create secret generic postgres-bugsink-secret \
#     --from-literal=POSTGRES_DB=bugsink --from-literal=POSTGRES_USER=bugsink \
#     --from-literal=POSTGRES_PASSWORD="$PGPW"
#   unset PGPW
#
# SECRET_KEY must differ from both docker instances'. Adding a key later:
# `patch secret --type=merge -p '{"stringData":{...}}'` + `rollout restart deploy/bugsink`,
# since envFrom is read once at container start. CREATE_SUPERUSER ("email:password") fires
# only while the instance has zero users - after that, `bugsink-manage changepassword`.
apiVersion: v1
kind: Secret
metadata:
  name: bugsink-secret
  namespace: monitoring
type: Opaque
stringData:
  SECRET_KEY: ""
  POSTGRES_PASSWORD: ""
  EMAIL_HOST_USER: ""
  EMAIL_HOST_PASSWORD: ""
  # CREATE_SUPERUSER: "you@example.com:a-password"

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-bugsink-secret
  namespace: data
  labels:
    app: postgres-bugsink
type: Opaque
stringData:
  POSTGRES_DB: "bugsink"
  POSTGRES_USER: "bugsink"
  POSTGRES_PASSWORD: ""

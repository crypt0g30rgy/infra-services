# The UI, through the k8s traefik (not the compose traefik that owns
# bugsink.internal.example.com). Host is a placeholder, substituted at apply time. No spec.tls:
# TLS ends at Cloudflare, as with every Ingress here. No basicauth either - it would swallow
# the SDKs' POSTs to /api/<project>/envelope/, which the DSN key already authenticates.
#   kubectl -n monitoring port-forward svc/bugsink 8000:8000   # before the DNS record exists
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bugsink
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: bugsink.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bugsink
                port:
                  number: 8000

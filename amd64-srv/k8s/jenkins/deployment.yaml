apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
spec:
  replicas: 1
  # Recreate, not RollingUpdate: jenkins-home is RWO, so a surged second pod - especially
  # one on another node - blocks forever on Multi-Attach. One pod at a time, always.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      serviceAccountName: jenkins

      # The pi — the only node, as of 2026-09-14. This read `amd64` (the dell) until the
      # dell was removed from the cluster; an amd64 selector now matches nothing and the
      # pod sits Pending. jenkins/jenkins:2.580 is multi-arch, so the move is free.
      #
      # The CPU argument that motivated the original pin is now moot — there is nowhere
      # else to go. Watch Jenkins' 500m against the pi's budget instead: the old crowding
      # (~3670m of 4000m requested) is what pushed it off this node in the first place.
      nodeSelector:
        kubernetes.io/arch: arm64

      containers:
      - name: jenkins
        image: jenkins/jenkins:2.583-alpine

        ports:
        - containerPort: 8080
        # - containerPort: 50000

        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"

        volumeMounts:
        - name: jenkins-home
          mountPath: /var/jenkins_home

      volumes:
      - name: jenkins-home
        persistentVolumeClaim:
          claimName: jenkins-home

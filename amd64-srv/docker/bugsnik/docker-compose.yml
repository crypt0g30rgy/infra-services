# Bugsink on the amd64 node. The arm64 instance and the full README are in
# ../../../arm64-srv/docker/bugsnik/; only the differences live here. No traefik on
# this host, so no router labels and no `internal` network (which is why this is a
# separate file, not a copy) - it is reached directly on ${BUGSINK_HOST_PORT} and
# BASE_URL is host:port rather than an https name.
#
# CAUTION: the container currently running predates the ./data bind mount, so
# /data/db.sqlite3 is still in its writable layer and any recreate deletes it.
# Rescue it before the next `up`:
#
#   docker compose stop bugsink        # stop, NOT down - down removes the layer
#   mkdir -p data && sudo chown -R 14237:14237 data
#   docker cp bugsink:/data/db.sqlite3 data/db.sqlite3
#   sudo chown 14237:14237 data/db.sqlite3
#   docker compose up -d               # recreates onto the bind mount

services:
  bugsink:
    image: bugsink/bugsink:2.5.1
    container_name: bugsink
    restart: unless-stopped

    # Everything lives in .env; the two below are derived from it.
    env_file:
      - .env

    environment:
      # No proxy here, so this is the published port, no trailing slash. Not
      # ${BUGSINK_INTERNAL_HOST} - that name resolves to the arm64 node, and using it
      # would build DSNs pointing at the other server. Override BUGSINK_NODE_HOST in
      # .env; the default is this node's current LAN address.
      BASE_URL: "http://${BUGSINK_NODE_HOST:-192.168.0.60}:${BUGSINK_HOST_PORT}"
      # Django answers 400 to any Host not listed here.
      ALLOWED_HOSTS: "${BUGSINK_NODE_HOST:-192.168.0.60},dell-amd64-srv,127.0.0.1,localhost"
      # Nothing terminates TLS here, so the arm64 file's `true` would have Django
      # expecting an X-Real-Ip and https scheme that never arrive - CSRF failures on
      # every login POST.
      BEHIND_HTTPS_PROXY: "false"

    ports:
      - "${BUGSINK_HOST_PORT}:${PORT}"

    volumes:
      # db.sqlite3 lives here. Must exist and be owned by the image's uid 14237
      # BEFORE the first `up`, or docker creates it root-owned and migrations fail
      # read-only:  mkdir -p data && sudo chown -R 14237:14237 data
      - ./data:/data

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://127.0.0.1:${PORT}/health/ready\").raise_for_status()'"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First boot runs `check --deploy` and every migration before it listens.
      start_period: 60s

    deploy:
      resources:
        limits:
          # Below the arm64 instance's 768M on purpose: this is the node that ran out
          # of memory on 2026-09-05. See ../../../incidents/2026-09-05-node-hardening.md
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 192M

# Bugsink on the amd64 node - one instance per node, this is the amd64 one.
# The arm64 instance is ../../../arm64-srv/docker/bugsnik/, and that directory
# holds the full README; only the differences are explained here.
#
# What differs on this node, and why this is a separate file rather than a copy:
#
#   * No traefik on this host, so no router labels and no `internal` network.
#     This host's networks are `proxy`, `meet-to-meat` and the per-project
#     bridges; the arm64 file joins an external network named `internal` that
#     does not exist here, so that file cannot be applied on this node at all.
#   * Reached directly on ${BUGSINK_HOST_PORT} (8000 here, 8001 on arm64 where
#     traefik owns 443).
#   * BASE_URL therefore has to be the host:port, not an https name.
#
# ---------------------------------------------------------------------------
# BEFORE THE NEXT `docker compose up` ON THIS HOST - READ THIS
# ---------------------------------------------------------------------------
# The container running right now was started without the ./data bind mount, so
# /data/db.sqlite3 (684K as of 2026-09-05) lives in the container's writable
# layer. `docker compose down`, `--force-recreate`, or any `up` that decides to
# replace the container deletes it. Rescue it first:
#
#   docker compose stop bugsink        # stop, NOT down - down removes the layer
#   mkdir -p data && sudo chown -R 14237:14237 data
#   docker cp bugsink:/data/db.sqlite3 data/db.sqlite3
#   sudo chown 14237:14237 data/db.sqlite3
#   docker compose up -d               # recreates, this time on the bind mount
#
# The bind mount below is what stops this from being true a second time.

services:
  bugsink:
    image: bugsink/bugsink:2.5.1
    container_name: bugsink
    restart: unless-stopped

    # Every setting comes from .env; the two below are derived from it so a host
    # name is written down exactly once.
    env_file:
      - .env

    environment:
      # No proxy in front of this instance, so the browser reaches it on the
      # published port and BASE_URL has to say so. No trailing slash.
      #
      # It deliberately does NOT use ${BUGSINK_INTERNAL_HOST}: that name belongs
      # to the arm64 instance and resolves to that node, so using it here would
      # build DSNs and alert links that point at the other server. Set
      # BUGSINK_NODE_HOST in .env to this node's name or address; the default
      # below is its current LAN address.
      BASE_URL: "http://${BUGSINK_NODE_HOST:-192.168.0.60}:${BUGSINK_HOST_PORT}"
      # Django answers 400 to any Host not listed here.
      ALLOWED_HOSTS: "${BUGSINK_NODE_HOST:-192.168.0.60},dell-amd64-srv,127.0.0.1,localhost"
      # There is no reverse proxy terminating TLS on this node, so the arm64
      # file's BEHIND_HTTPS_PROXY=true would make Django expect an X-Real-Ip and
      # an https scheme that never arrive - every login POST would fail CSRF.
      BEHIND_HTTPS_PROXY: "false"

    ports:
      - "${BUGSINK_HOST_PORT}:${PORT}"

    volumes:
      # db.sqlite3 lives here. The image runs as uid/gid 14237 and docker
      # creates a missing bind-mount source as root, so this must exist and be
      # owned by 14237 BEFORE the first `up` or migrations die read-only:
      #   mkdir -p data && sudo chown -R 14237:14237 data
      - ./data:/data

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD-SHELL", "python -c 'import requests; requests.get(\"http://127.0.0.1:${PORT}/health/ready\").raise_for_status()'"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First boot runs `check --deploy` and every migration before it listens.
      start_period: 60s

    deploy:
      resources:
        limits:
          # Lower than the arm64 instance's 768M on purpose: this node reserves
          # 6Gi for non-Kubernetes processes and is the one that ran out of
          # memory on 2026-09-05. See ../../../incidents/2026-09-05-node-hardening.md
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 192M
